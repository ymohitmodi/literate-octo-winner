# Optional infrastructure layer — the System Design manual's serving stack,
# scaled to one machine. NOT required to run Mythos (the CLI runs everything in
# one process); this is here so you can SEE the distributed-serving concepts:
#
#   client -> nginx gateway (L7 load balancing across 2 stateless workers)
#          -> inference workers (each holds the model)
#          -> Prometheus (scrapes /metrics) -> Grafana (dashboards)
#
# Usage:
#   python -m mythos.cli all --preset tiny     # produce ./artifacts first
#   docker compose up --build
#   curl localhost:8080/healthz
services:
  worker1:
    build: .
    volumes: ["./artifacts:/app/artifacts:ro"]
    environment: ["MYTHOS_SIGNING_KEY=change-me", "MYTHOS_AUTH_SALT=change-me"]
    expose: ["8000"]

  worker2:
    build: .
    volumes: ["./artifacts:/app/artifacts:ro"]
    environment: ["MYTHOS_SIGNING_KEY=change-me", "MYTHOS_AUTH_SALT=change-me"]
    expose: ["8000"]

  gateway:
    image: nginx:1.27-alpine
    depends_on: [worker1, worker2]
    ports: ["8080:80"]
    volumes: ["./infra/nginx.conf:/etc/nginx/nginx.conf:ro"]

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes: ["./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]

  grafana:
    image: grafana/grafana:latest
    depends_on: [prometheus]
    ports: ["3000:3000"]
    environment: ["GF_AUTH_ANONYMOUS_ENABLED=true", "GF_AUTH_ANONYMOUS_ORG_ROLE=Admin"]
