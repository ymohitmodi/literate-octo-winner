# L7 load balancer across two stateless inference workers (System Design manual:
# round-robin by default; health checks remove dead backends). Because workers
# are stateless, any worker can serve any request.
events { worker_connections 1024; }
http {
  upstream mythos_workers {
    least_conn;                 # send to the worker with fewest active conns
    server worker1:8000 max_fails=3 fail_timeout=10s;
    server worker2:8000 max_fails=3 fail_timeout=10s;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://mythos_workers;
      proxy_connect_timeout 2s;       # timeouts on every call
      proxy_read_timeout 30s;
    }
    location /healthz { proxy_pass http://mythos_workers; }
  }
}
